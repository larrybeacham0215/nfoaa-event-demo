<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Receipt | Never Fight or Argue Again</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body>
<div class="test">TEST MODE - no real charge</div>
<div class="wrap"><h1>Thank you!</h1><h2>Show this QR code at the book table</h2>
<div class="card" id="c"><p class="muted">Loading your receipt...</p></div>
<div class="card" id="em" style="display:none"><b>Email copy (test preview, not sent)</b><p class="muted" id="emb"></p></div>
<p class="muted">Tip: take a screenshot of this page, or bookmark it.</p></div>
<script src="config.js"></script><script>
const t=new URLSearchParams(location.search).get("t")||"";
api("book-sale-receipt?t="+encodeURIComponent(t)).then(([s,d])=>{const c=document.getElementById("c");
if(!d.order){c.innerHTML='<div class="big bad">Receipt not found</div>';return}
const o=d.order,left=o.quantity-o.redeemed_qty;
c.innerHTML=`<div style="text-align:center"><span class="pill" style="${o.status=='paid'?'':'background:#b3261e'}">${o.status.toUpperCase()}</span></div><div id="qr"></div>
<div class="row"><span>Receipt</span><b>${o.receipt_no}</b></div><div class="row"><span>Name</span><b></b></div>
<div class="row"><span>Books</span><b>${o.quantity}</b></div><div class="row"><span>Amount</span><b>${money(o.amount_cents)}</b></div>
<div class="row"><span>Paid</span><b>${when(o.paid_at)}</b></div><div class="row"><span>Picked up</span><b>${o.redeemed_qty} of ${o.quantity}${left==0?' (all picked up)':''}</b></div>`;
c.querySelectorAll(".row b")[1].textContent=o.buyer_name;
new QRCode(document.getElementById("qr"),{text:"NFOAA:"+t,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
document.getElementById("em").style.display="block";
document.getElementById("emb").textContent=`Subject: Your receipt ${o.receipt_no} for Never Fight or Argue Again. Hi ${o.buyer_name}, thank you for your order of ${o.quantity} book(s), ${money(o.amount_cents)}. Show the QR code at this link at the book table to pick up your copy: ${location.href}`;
});
</script></body></html>
